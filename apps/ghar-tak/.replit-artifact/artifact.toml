kind = "web"
previewPath = "/"
title = "Ghar Tak"
version = "1.0.0"
id = "apps/ghar-tak"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20401

[services.development]
run = "pnpm --filter @workspace/ghar-tak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghar-tak", "run", "build" ]
publicDir = "apps/ghar-tak/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20401"
BASE_PATH = "/"
