kind = "mobile"
previewPath = "/ghar-tak-mobile/"
title = "Ghar Tak Mobile"
version = "1.0.0"
id = "apps/ghar-tak-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/ghar-tak-mobile/" ]
localPort = 21122

[services.development]
run = "pnpm --filter @workspace/ghar-tak-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghar-tak-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ghar-tak-mobile", "run", "serve" ]

[services.env]
PORT = "21122"
BASE_PATH = "/ghar-tak-mobile/"
